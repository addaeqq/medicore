server:
  port: ${PORT:4000}
  servlet:
    session:
      timeout: 30m                    # FR-AUTH-08
      cookie:
        http-only: true               # DD-02
        same-site: ${COOKIE_SAMESITE:lax}   # 'none' + secure=true if API and web are on different origins
        secure: ${COOKIE_SECURE:false}   # true in production (NFR-SEC-01)

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/medicore}
    username: ${DB_USER:medicore}
    password: ${DB_PASS:medicore_dev}
  jpa:
    hibernate:
      ddl-auto: none              # Flyway owns the schema (Design §2.3)
    open-in-view: false
  session:
    jdbc:
      initialize-schema: always       # Spring Session tables in the same PostgreSQL
  flyway:
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration}   # add ,classpath:db/seed for demo deploys
    enabled: true

medicore:
  cors-origin: ${CORS_ORIGIN:http://localhost:3000}
  itc:                                # ITC Transflow Checkout (SRS OI-5 resolved; DD-07 adapter)
    base-url: ${ITC_BASE_URL:https://apisuat.itcsrvc.com/checkout}   # UAT default; LIVE: https://apis.itcsrvc.com/checkout
    api-key: ${ITC_API_KEY:}
    merchant-product-id: ${ITC_MERCHANT_PRODUCT_ID:}
    transflow-id: ${ITC_TRANSFLOW_ID:}
    currency: ${ITC_CURRENCY:GHS}
    callback-url: ${ITC_CALLBACK_URL:http://localhost:4000/api/payments/callback}
    success-redirect-url: ${ITC_SUCCESS_URL:http://localhost:3000/payments/success}
    failure-redirect-url: ${ITC_FAILURE_URL:http://localhost:3000/payments/failure}
    page-title: ${ITC_PAGE_TITLE:MediCore HMS}
    logo: ${ITC_LOGO:}
  seed: ${MEDICORE_SEED:false}
  cancel-cutoff-hours: 2              # FR-APT-05
  lockout:
    max-attempts: 5                   # FR-AUTH-06
    window-minutes: 15
